syntax = "proto3";

package buf.protoschema.test.v1;

// Everything declared in this file is deprecated by the file-level option,
// without any type needing its own `deprecated` option.
option deprecated = true;

// A message that is deprecated only by the file-level option.
message DeprecatedFileTest {
  string string_field = 1;
  // A field referencing an enum deprecated only by the file-level option.
  DeprecatedFileEnum enum_field = 2;
}

// An enum that is deprecated only by the file-level option.
enum DeprecatedFileEnum {
  DEPRECATED_FILE_ENUM_UNSPECIFIED = 0;
  DEPRECATED_FILE_ENUM_ONE = 1;
}
